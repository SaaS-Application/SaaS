spring:
  datasource:
    url: jdbc:h2:mem:payroll_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: false

jwt:
  secret: test-secret-key-12345678901234567890
  expiration-ms: 3600000

app:
  super-admin:
    username: superadmin
    email: superadmin@payroll.local
    password: Test@12345
